<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obsidian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#0b0b0c; --ink-soft:rgba(11,11,12,.5);
    --pill:rgba(255,255,255,.78); --pill-line:rgba(11,11,12,.08);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#050506; --ink:#f2f2f3; --ink-soft:rgba(242,242,243,.5);
      --pill:rgba(20,20,22,.7); --pill-line:rgba(255,255,255,.1); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#050506; --ink:#f2f2f3; --ink-soft:rgba(242,242,243,.5);
    --pill:rgba(20,20,22,.7); --pill-line:rgba(255,255,255,.1); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #veil{position:fixed;inset:0;background:var(--bg);pointer-events:none;z-index:5}
  #hint{position:fixed;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));text-align:center;
    font-weight:300;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
    opacity:0;pointer-events:none;z-index:4}
  #toast{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    display:flex;gap:12px;align-items:center;padding:10px 18px;border-radius:999px;
    background:var(--pill);border:1px solid var(--pill-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font-size:12px;font-weight:400;letter-spacing:.08em;opacity:0;pointer-events:none;z-index:6;white-space:nowrap}
  #toast code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-soft)}
  :root[data-theme="dark"] .i-moon,:root:not([data-theme="dark"]) .i-sun{display:none}
  #logo{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));top:calc(18px + env(safe-area-inset-top,0px));
    font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--ink);pointer-events:none;z-index:4;white-space:nowrap}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  .co{position:absolute;left:0;top:0;color:var(--ink);will-change:transform,opacity}
  .co svg{position:absolute;left:0;top:0;overflow:visible}
  .co path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .co .nd{fill:var(--ink)} .co .rg{fill:none;stroke:var(--ink);stroke-width:1.5}
  .co .blk{position:absolute;width:max-content;max-width:250px}
  .co .t{display:block;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;line-height:1.25}
  .co .sm{display:block;font-weight:400;font-size:11px;line-height:1.45;letter-spacing:.02em;opacity:.8;margin-top:3px}
  .co .bx{display:block;width:max-content;max-width:240px;background:var(--ink);color:var(--bg);padding:5px 10px;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
  .co .bx.sm{font-weight:600;font-size:11px;text-transform:none;opacity:1;margin:0;line-height:1.35;letter-spacing:.02em}
  .co.k-box .in{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .co.k-dots .blk{text-align:center} .co.k-dots .t{font-size:15px} .co i{font-style:italic;opacity:.7}
  #reset2{position:fixed;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:1px solid var(--pill-line);border-radius:50%;
    background:var(--pill);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);display:grid;place-items:center;cursor:pointer;
    opacity:0;transform:scale(.8);pointer-events:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);z-index:4}
  #reset2.on{opacity:.85;transform:scale(1);pointer-events:auto} #reset2.on:hover{opacity:1}
  #reset2 svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  #dock{position:fixed;left:0;top:0;display:flex;align-items:center;gap:2px;padding:4px 6px 4px 2px;border-radius:999px;
    background:var(--pill);border:1px solid var(--pill-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    opacity:.3;transition:opacity .5s ease;z-index:7;touch-action:none}
  #dock:hover,#dock:focus-within,#dock.drag{opacity:1}
  #dock button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .3s}
  #facts{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));top:calc(40px + env(safe-area-inset-top,0px));pointer-events:none;z-index:4;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  #facts b{color:var(--ink);font-weight:600}
  #facts .fd{display:flex;gap:4px;margin-top:6px} #facts .fd i{display:block;width:14px;height:2px;background:var(--ink);opacity:.18;transform-origin:left center} #facts .fd i.on{opacity:1}
  #say{position:fixed;left:0;top:0;font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--ink);pointer-events:none;z-index:4;opacity:0;white-space:nowrap;will-change:transform}
  #snd[aria-pressed="true"] .i-on,#snd[aria-pressed="false"] .i-off{display:none}
  #dock button[hidden]{display:none}
  #dock button:hover,#dock button[aria-pressed="true"]{background:var(--pill-line)}
  #dock button:focus-visible{outline:1px solid var(--ink-soft)}
  #dock .grip{width:22px;height:34px;display:grid;place-items:center;cursor:grab;color:var(--ink-soft)}
  #dock.drag .grip{cursor:grabbing}
  #dock svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  #dock .grip svg{width:10px;fill:currentColor;stroke:none}
  #fallback[hidden]{display:none}
  #fallback{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.1em;color:var(--ink-soft)}
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="veil"></div>
<div id="logo" aria-label="emdash.click">—emdash.click</div>
<div id="facts" aria-live="polite"></div>
<div id="say" aria-hidden="true"></div>
<div id="hud" aria-hidden="true"></div>
<button id="reset2" type="button" aria-label="Bring bar back to center" title="Bring back"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/></svg></button>
<div id="hint">Pick up. Throw. Right-click to flick.</div>
<div id="toast" role="status" aria-live="polite"><span id="t-label">Copied</span><code id="t-code"></code></div>
<div id="dock" role="toolbar" aria-label="Controls">
  <span class="grip" title="Drag to move"><svg viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.3"/><circle cx="7" cy="3" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="7" cy="8" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="7" cy="13" r="1.3"/></svg></span>
  <button id="reset" type="button" aria-label="Reset bar (R)" title="Reset (R)"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/></svg></button>
  <button id="grav" type="button" aria-pressed="false" aria-label="Toggle low gravity (G)" title="Gravity: normal (G)"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg></button>
  <button id="slow" type="button" hidden aria-pressed="false" aria-label="Toggle slow motion (M)" title="Slow-mo: off (M)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg></button>
  <button id="snd" type="button" aria-pressed="false" aria-label="Mute sound" title="Sound: on"><svg class="i-on" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg><svg class="i-off" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <button id="theme" type="button" aria-label="Toggle theme (T)" title="Toggle theme (T)">
  <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
</div>
<div id="fallback" hidden>WebGL is unavailable in this browser.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/shaders/BokehShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/postprocessing/BokehPass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
'use strict';

/* ───────────── 0. CONSTANTS & HELPERS ───────────── */
const BAR = { L: 1.7, H: 0.25, D: 0.25, R: 0.035, MASS: 4 };
const FIXED = 1 / 120;                       // physics step
const root = document.documentElement;
const canvas = document.getElementById('c');
const mix = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ───────────── 1. RENDERER ───────────── */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('fallback').hidden = false; return; }
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // (re-applied in the final pass, since the composer renders to linear targets)
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ───────────── 2. SCENE, FOG, CAMERA ───────────── */
const scene = new THREE.Scene();               // no scene.background: the clear colour is used so BokehPass depth stays clean
scene.fog = new THREE.FogExp2(0xffffff, 0.03);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 80);
const camState = { zs: 1, zt: 1, dolly: 1, baseZ: 6.4, baseY: 2.1, ox: 0, oy: 0, tx: 0, ty: 0 };

/* ───────────── 3. LIGHTS (shadow casters follow the bar) ───────────── */
const ambient = new THREE.AmbientLight(0xffffff, 0.9);
const key = new THREE.DirectionalLight(0xffffff, 2);       // key light
const jit = new THREE.DirectionalLight(0xffffff, 0.6);     // second angle -> softer penumbra
const spot = new THREE.SpotLight(0xffffff, 0, 0, 0.6, 1, 1); // dark-theme pool of light (also a soft-shadow caster in light theme)
[key, jit, spot].forEach((l, i) => {
  l.castShadow = true;
  l.shadow.mapSize.set(i === 0 ? 2048 : 1024, i === 0 ? 2048 : 1024);
  l.shadow.bias = -0.0004; l.shadow.normalBias = 0.02;
  if (l.isDirectionalLight) { const c = l.shadow.camera; c.left = c.bottom = -4.5; c.right = c.top = 4.5; c.near = 1; c.far = 24; }
  else { l.shadow.camera.near = 2; l.shadow.camera.far = 24; }
});
scene.add(ambient, key, key.target, jit, jit.target, spot, spot.target);
const glow = new THREE.PointLight(0xf2f6ff, 0, 14, 2);   // the bar's own light (dark theme); always present so shaders never recompile
scene.add(glow);

/* ───────────── 4. FLOORS (infinite illusion) ───────────── */
const shadowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.3, transparent: true, depthWrite: false }));
shadowFloor.rotation.x = -Math.PI / 2; shadowFloor.position.y = 0.001; shadowFloor.receiveShadow = true;
const darkFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x202020, roughness: 0.9, metalness: 0, transparent: true, opacity: 0 }));
darkFloor.rotation.x = -Math.PI / 2; darkFloor.position.y = -0.002; darkFloor.receiveShadow = true; darkFloor.visible = false;
scene.add(shadowFloor, darkFloor);

/* ───────────── 5. THE OBJECT: obsidian bar ───────────── */
// Rounded box whose segments are concentrated in the corner zones, with analytic smooth normals.
function roundedBox(w, h, d, r, flat, kk) {
  const g = new THREE.BoxGeometry(1, 1, 1, 2 * (flat[0] + kk), 2 * (flat[1] + kk), 2 * (flat[2] + kk));
  const pos = g.attributes.position, nor = g.attributes.normal;
  const half = [w / 2, h / 2, d / 2], inner = half.map(v => v - r);
  const a = flat.map(f => f / (f + kk));
  const c = [0, 0, 0], q = [0, 0, 0], n = [0, 0, 0];
  for (let i = 0; i < pos.count; i++) {
    for (let k = 0; k < 3; k++) {
      const s = pos.array[i * 3 + k] * 2, u = Math.abs(s);
      const v = u <= a[k] ? inner[k] * (u / a[k]) : inner[k] + r * (u - a[k]) / (1 - a[k]);
      c[k] = Math.sign(s) * Math.min(v, half[k]);
      q[k] = clamp(c[k], -inner[k], inner[k]); n[k] = c[k] - q[k];
    }
    const len = Math.hypot(n[0], n[1], n[2]) || 1;
    for (let k = 0; k < 3; k++) { n[k] /= len; pos.array[i * 3 + k] = q[k] + n[k] * r; nor.array[i * 3 + k] = n[k]; }
  }
  return g;
}
// Procedural studio environments (PMREM) for the polished reflections
function makeEnv(dark) {
  const s = new THREE.Scene();
  const col = (r, g, b, i = 1) => new THREE.Color(r * i, g * i, b * i);
  s.add(new THREE.Mesh(new THREE.BoxGeometry(24, 24, 24),
    new THREE.MeshBasicMaterial({ color: dark ? col(.008, .008, .01) : col(.1, .1, .11), side: THREE.BackSide })));
  const panel = (w, h, p, c) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.position.set(...p); m.lookAt(0, 0, 0); s.add(m);
  };
  if (dark) {
    panel(10, 2, [0, 9, 1], col(.9, .95, 1, 1.4));
    panel(2, 12, [-9, 2, 1], col(.65, .8, 1, 2.6));
    panel(2, 12, [9, 2, -4], col(1, .78, .55, 1.5));
  } else {
    panel(14, 7, [0, 9, 1], col(1, 1, 1, 3.4));
    panel(2, 12, [-9, 2, 0], col(1, 1, 1, 2.4));
    panel(2, 12, [9, 2, -3], col(1, 1, 1, 1.7));
    panel(20, 20, [0, -6, 0], col(.1, .1, .1));
  }
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(s, 0.035).texture; pm.dispose();
  s.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  return tex;
}
const envs = { light: makeEnv(false), dark: makeEnv(true) };
const barMat = new THREE.MeshPhysicalMaterial({
  color: 0x000000, roughness: 0.07, metalness: 0.1,
  clearcoat: 1, clearcoatRoughness: 0.03, envMap: envs.light, envMapIntensity: 1.0,
  emissive: 0xf2f6ff, emissiveIntensity: 0 });   // ramps up in dark theme: the bar becomes the light source
const mesh = new THREE.Mesh(roundedBox(BAR.L, BAR.H, BAR.D, BAR.R, [8, 2, 2], 5), barMat);
mesh.castShadow = true;
scene.add(mesh);

/* ───────────── 6. PHYSICS (cannon.js) ───────────── */
const world = new CANNON.World();
world.gravity.set(0, -24, 0);                 // a touch heavy: reads as "weighty obsidian"
world.solver.iterations = 24;
world.allowSleep = true;
const mBar = new CANNON.Material('bar'), mWorld = new CANNON.Material('world');
world.addContactMaterial(new CANNON.ContactMaterial(mBar, mWorld, {
  friction: 0.38, restitution: 0.3, contactEquationStiffness: 1e8, contactEquationRelaxation: 3, frictionEquationStiffness: 1e8 }));
const addPlane = (p, axis, ang) => {
  const b = new CANNON.Body({ mass: 0, material: mWorld, position: new CANNON.Vec3(...p) });
  b.addShape(new CANNON.Plane()); b.quaternion.setFromAxisAngle(new CANNON.Vec3(...axis), ang); world.addBody(b);
};
const P = Math.PI / 2;
addPlane([0, 0, 0], [1, 0, 0], -P);            // floor
addPlane([0, 9, 0], [1, 0, 0], P);             // ceiling
addPlane([-13, 0, 0], [0, 1, 0], P);           // invisible walls (lost in fog)
addPlane([13, 0, 0], [0, 1, 0], -P);
addPlane([0, 0, -13], [0, 1, 0], 0);
addPlane([0, 0, 4.6], [0, 1, 0], Math.PI);

const body = new CANNON.Body({
  mass: BAR.MASS, material: mBar, linearDamping: 0.04, angularDamping: 0.1,
  allowSleep: true, sleepSpeedLimit: 0.12, sleepTimeLimit: 0.5 });
body.addShape(new CANNON.Box(new CANNON.Vec3(BAR.L / 2, BAR.H / 2, BAR.D / 2)));
world.addBody(body);
function spawn() {                              // drop in from just above centre with a slight tilt -> settling animation
  body.position.set(0, 0.9, 0);
  body.quaternion.setFromEuler(0.12, 0.35, 0.18, 'XYZ');
  body.velocity.set(0, 0, 0); body.angularVelocity.set(0, 0, 0);
}
spawn();
let started = false;

/* ───────────── 7. POST-PROCESSING ───────────── */
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new THREE.EffectComposer(renderer, rt);
composer.setPixelRatio(DPR);
composer.addPass(new THREE.RenderPass(scene, camera));
const bokeh = new THREE.BokehPass(scene, camera, { focus: 7, aperture: 0.004, maxblur: 0.01 });
bokeh.needsSwap = true;                        // so the blurred result feeds the next pass
composer.addPass(bokeh);
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1, 1), 0.1, 0.7, 1.05);
composer.addPass(bloom);
// Final pass: ACES (normalised so linear white stays pure white) + vignette + sRGB + dither
const finalPass = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, uVig: { value: 0.07 }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uVig; uniform float uTime; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      c = min(aces(c) / aces(vec3(1.0)), 1.0);
      c = pow(c, vec3(1.0/2.2));
      c *= 1.0 - uVig * smoothstep(0.3, 0.95, distance(vUv, vec2(.5)) * 1.25);
      c += (fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898,78.233))) * 43758.5453) - .5) / 255.;
      gl_FragColor = vec4(c, 1.0);
    }`
});
composer.addPass(finalPass);

/* ───────────── 8. THEME (T) ───────────── */
const TH = {
  light: { bg: new THREE.Color(1, 1, 1), dens: 0.03, amb: 0.9, key: 2.0, jit: 0.6, spot: 0, vig: 0.04, bS: 0.1, bT: 1.05, env: 1.0, shadow: 0.4, emis: 0, glow: 0, bR: 0.7 },
  dark:  { bg: new THREE.Color(0.003, 0.003, 0.004), dens: 0.055, amb: 0.03, key: 0.1, jit: 0, spot: 0.03, vig: 0.65, bS: 1.1, bT: 0.9, env: 1.0, shadow: 0, emis: 4, glow: 2.6, bR: 0.9 }
};
const keyLight = new THREE.Color(1, 1, 1), keyDark = new THREE.Color(0.8, 0.88, 1);
const bgCol = new THREE.Color();
const th = { t: 0 };
let envDark = false;
function applyTheme(t) {
  const L = TH.light, D = TH.dark;
  bgCol.lerpColors(L.bg, D.bg, t);

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.14, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);

}
body.addEventListener('collide', e => {
  if (!sndOK() || resetting) return;
  const v = Math.abs(e.contact.getImpactVelocityAlongNormal()), now = performance.now();
  if (v < 0.7 || now - AUD.last < 45) return;
  AUD.last = now; tok(v);
});

/* ───────────── 10b. HUD: object-tracking call-outs (while the bar rests) ───────────── */
const hudEl = document.getElementById('hud');
const FACTS = [
  { k: 'box',  f: -0.85, t: 'Interruption in dialogue', s: 'Scripts use it to mark a character abruptly cut off.' },
  { k: 'dots', f: 0,     t: 'Staccato poetic flow', s: '“Because I could not stop for Death—<br>He kindly stopped for me—”<br><i>Emily Dickinson</i>' },
  { k: 'row',  f: -1,    t: 'Named for the letter M', s: 'An em is the width of a capital M.' },
  { k: 'lead', f: 0.85,  t: 'The longest dash', s: 'Hyphen, then en dash, then em dash.' },
  { k: 'box',  f: 0.85,  t: 'No key of its own', s: 'Mac: ⌥ ⇧ –  ·  Windows: Alt + 0151' },
  { k: 'dots', f: 0.2,   t: 'Typewriter stand-in', s: 'Typists faked it with two hyphens (--).' },
  { k: 'lead', f: -0.85, t: 'Does the work of three', s: 'Commas, colons and parentheses.' },
  { k: 'row',  f: 1,     t: 'Unicode U+2014', s: 'In HTML: &amp;mdash;' }
];
const hud = { i: 0, cur: null, tl: null, restT: 0, nextAt: 0 };
const aPt = new THREE.Vector3();
function screenOf(F) {                          // bar-local anchor → screen px (follows position, rotation, camera)
  aPt.set(F.f * BAR.L / 2, BAR.H / 2, 0); mesh.localToWorld(aPt); aPt.project(camera);
  return { x: (aPt.x * 0.5 + 0.5) * innerWidth, y: (-aPt.y * 0.5 + 0.5) * innerHeight, ok: aPt.z < 1 };
}
function layout(k, s, T, S) {
  const c = (x, y, cls, r = 4) => `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"/>`;
  const path = d => `<path pathLength="1" d="${d}"/>`;
  const blk = (x, y, tx, ty, inner, extra = '') => `<div class="blk" style="left:${x}px;top:${y}px;transform:translate(${tx},${ty}) ${extra}${extra ? '' : ''}"><div class="in">${inner}</div></div>`;
  const side = s > 0 ? ['0', 'left'] : ['-100%', 'right'];
  let svg = '', html = '';

    svg = path(`M0 0L${s * 30} -44L${s * 30} -104`) + c(0, 0, 'nd') + c(s * 30, -44, 'nd', 3.5) + c(s * 30, -104, 'nd');
    html = blk(s * 30, -116, '-50%', '-100%', `<span class="bx">${T}</span><span class="bx sm">${S}</span>`);
  } else if (k === 'lead') {

    html = blk(s * 158, -34, side[0], '-50%', `<span class="t" style="text-align:${side[1]}">${T}</span><span class="sm" style="text-align:${side[1]}">${S}</span>`);
  } else if (k === 'dots') {

    html = blk(0, -164, '-50%', '-100%', `<span class="t">${T}</span><span class="sm">${S}</span>`, 'rotate(-5deg)');
  } else {
    svg = c(0, 0, 'nd') + [1, 2, 3, 4, 5].map(i => c(s * 22 * i, 0, 'rg', 4)).join('');
    html = blk(s * 142, 0, side[0], '-50%', `<span class="t" style="text-align:${side[1]}">${T}</span><span class="sm" style="text-align:${side[1]}">${S}</span>`);

}
function hudShow() {
  const F = FACTS[hud.i++ % FACTS.length];
  noteFact((hud.i - 1) % FACTS.length);
  let s = F.f < 0 ? -1 : (F.f > 0 ? 1 : (hud.i % 2 ? 1 : -1));
  const p = screenOf(F);                        // flip toward open space if near an edge
  if (s > 0 && p.x > innerWidth - 320) s = -1; else if (s < 0 && p.x < 320) s = 1;
  const el = document.createElement('div');
  el.className = 'co k-' + F.k; el._F = F; el.innerHTML = layout(F.k, s, F.t, F.s);
  hudEl.appendChild(el); hud.cur = el; hudTrack();
  const paths = [...el.querySelectorAll('path')], pts = [...el.querySelectorAll('.nd,.rg')], inn = [...el.querySelectorAll('.in')];
  if (paths.length) gsap.set(paths, { strokeDasharray: 1, strokeDashoffset: 1 });   // 'dots' call-outs have no <path>
  if (pts.length) gsap.set(pts, { scale: 0, transformOrigin: '50% 50%', transformBox: 'fill-box' });
  if (inn.length) gsap.set(inn, { opacity: 0, y: 10 });
  hud.tl = gsap.timeline();
  if (pts.length) hud.tl.to(pts, { scale: 1, duration: 0.4, ease: 'back.out(3)', stagger: 0.07 });
  if (paths.length) hud.tl.to(paths, { strokeDashoffset: 0, duration: 0.8, ease: 'power2.inOut' }, 0.1);
  if (inn.length) hud.tl.to(inn, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.55);
  hud.tl.to({}, { duration: 4.6 }).call(() => hudHide(true));
}
function hudHide(auto) {
  if (!hud.cur) return;
  const el = hud.cur; hud.cur = null; if (hud.tl) hud.tl.kill();
  gsap.to(el, { opacity: 0, duration: 0.4, onComplete: () => el.remove() });
  hud.nextAt = performance.now() + (auto ? 700 : 0);
}
function hudTick(dt, et) {                      // cycle only while the bar is genuinely at rest
  // Measure real motion (position/orientation change) instead of body.velocity: the leash nudges velocity
  // every frame, which kept the bar from ever reading as "at rest".
  const q = body.quaternion, p = body.position, rm = hud.m || (hud.m = { x: p.x, y: p.y, z: p.z, qx: q.x, qy: q.y, qz: q.z, qw: q.w });
  const lin = Math.hypot(p.x - rm.x, p.y - rm.y, p.z - rm.z) / Math.max(dt, 1e-3);
  const ang = 2 * Math.acos(Math.min(1, Math.abs(q.x * rm.qx + q.y * rm.qy + q.z * rm.qz + q.w * rm.qw))) / Math.max(dt, 1e-3);
  rm.x = p.x; rm.y = p.y; rm.z = p.z; rm.qx = q.x; rm.qy = q.y; rm.qz = q.z; rm.qw = q.w;
  const rest = started && et > 3.2 && !held && !resetting && !mode && p.y < 0.45 && lin < 0.15 && ang < 0.3;
  hud.restT = rest ? hud.restT + dt : 0;
  if (!rest) hudHide();
  else if (hud.restT > 0.9 && !hud.cur && performance.now() > hud.nextAt) hudShow();
}
function hudTrack() {
  const sc = clamp(innerWidth / 1200, 0.75, 1.1);
  for (const el of hudEl.children) {
    const p = screenOf(el._F);
    el.style.display = p.ok ? '' : 'none';
    el.style.transform = `translate(${p.x}px,${p.y}px) scale(${sc})`;
  }
}

/* ───────────── 10c. FACTS COUNTER + REACTIONS ───────────── */
const factsEl = document.getElementById('facts'), found = new Set();
factsEl.innerHTML = `facts found <b id="fc-n">0/${FACTS.length}</b><div class="fd">${FACTS.map(() => '<i></i>').join('')}</div>`;
const fcN = document.getElementById('fc-n'), fcDash = factsEl.querySelectorAll('.fd i');
function noteFact(idx) {                          // each new call-out that appears fills one dash
  if (found.has(idx)) return;
  found.add(idx); const n = found.size;
  fcN.textContent = n === FACTS.length ? 'all ' + n + ' —' : n + '/' + FACTS.length;
  fcDash[n - 1].classList.add('on');
  gsap.fromTo(fcDash[n - 1], { scaleX: 0.15 }, { scaleX: 1, duration: 0.6, ease: 'back.out(3)' });
  chime(n);
  if (n === FACTS.length) gsap.delayedCall(0.9, () => say('all found—'));
}

let lastTouch = performance.now(), thrown = false;
const R = { dizzy: 0, cool: 0, dinged: false, nudging: false, nudgeAt: 0, sayOn: false, sayTl: null };
const sayEl = document.getElementById('say'), sayA = { f: 0 };
function say(t) {                                 // little speech bubble that rides on the bar
  sayEl.textContent = t; R.sayOn = true; if (R.sayTl) R.sayTl.kill();
  R.sayTl = gsap.timeline().fromTo(sayEl, { opacity: 0 }, { opacity: 1, duration: 0.25 })
    .to(sayEl, { opacity: 0, duration: 0.5, onComplete: () => { R.sayOn = false; } }, '+=1.3');
}
const wob = { t: 1 };
const wobble = () => { wob.t = 0; gsap.to(wob, { t: 1, duration: 1, ease: 'none', overwrite: true }); };   // squash-and-stretch jiggle
function reactTick(dt, et) {
  const now = performance.now(), p = body.position, d = Math.hypot(p.x, p.z), resting = hud.restT > 0.4;

  // landed after a throw: happy wobble if lying flat, a small "oof" if not; otherwise just a soft tink
  if (!resting) R.dinged = false;
  else if (!R.dinged) {
    R.dinged = true;
    if (thrown) {
      thrown = false;
      const ax = body.quaternion.vmult(new CANNON.Vec3(1, 0, 0));
      if (Math.abs(ax.y) < 0.25) { say('woo—'); wobble(); happy(); } else { say('oof—'); tink(); }
    } else tink();
  }

  // dizzy if it keeps spinning fast for too long: say so, then bleed the spin off
  if (!held && mode !== 'spin' && !resetting && body.angularVelocity.norm() > 5.5) R.dizzy += dt; else R.dizzy = Math.max(0, R.dizzy - dt * 2);
  R.cool -= dt;
  if (R.dizzy > 2.2 && R.cool <= 0) {
    R.dizzy = 0; R.cool = 9; say('whoa—'); whoa();
    body.angularDamping = 0.85;
    gsap.delayedCall(1.6, () => { if (!held && !mode) body.angularDamping = baseAng; });
  }

  // sheepish: ignored for a while and parked far from home → shuffles back toward the middle in little hops
  const idle = now - lastTouch, busy = held || resetting || mode || fk;
  if (R.nudging) {
    if (d < 0.8 || idle < 16000 || busy) R.nudging = false;
    else if (now > R.nudgeAt) nudge(p, d);
  } else if (idle > 16000 && resting && d > 1.3 && !busy) { R.nudging = true; say('sorry—'); nudge(p, d); }

  // wobble + speech bubble follow the bar
  if (wob.t < 1) { const w = (1 - wob.t) * (1 - wob.t) * Math.sin(wob.t * Math.PI * 6); mesh.scale.set(1 + 0.07 * w, 1 - 0.14 * w, 1 + 0.07 * w); }
  else if (mesh.scale.y !== 1) mesh.scale.set(1, 1, 1);
  if (R.sayOn) { const s = screenOf(sayA); sayEl.style.display = s.ok ? '' : 'none'; sayEl.style.transform = `translate(${s.x}px,${s.y - 46}px) translate(-50%,-100%)`; }
}
function nudge(p, d) {
  const v = body.velocity, k = grav.low ? 1.1 : 1.7;
  body.wakeUp();
  v.x -= (p.x / (d || 1)) * k; v.z -= (p.z / (d || 1)) * k; v.y += grav.low ? 1.4 : 2.4;
  body.angularVelocity.set(body.angularVelocity.x + (Math.random() - 0.5) * 0.8, body.angularVelocity.y + (Math.random() - 0.5) * 0.8, body.angularVelocity.z + (Math.random() - 0.5) * 0.8);
  R.nudgeAt = performance.now() + (grav.low ? 2600 : 1700);
}

/* ───────────── 11. LOOP ───────────── */
const clock = new THREE.Clock();
const wp = new CANNON.Vec3(), vp = new CANNON.Vec3(), F = new CANNON.Vec3(), r = new CANNON.Vec3(), tq = new CANNON.Vec3();
const follow = new THREE.Vector3(), plan = new THREE.Vector3();
let acc = 0, focus = 7;

// Critically-damped spring pulling the grabbed point to the cursor (mass-scaled, so the feel is size-independent)
function applyDrag() {
  const KP = 330, KD = 34, MAXA = 650;
  body.pointToWorldFrame(grabLocal, wp);
  body.getVelocityAtWorldPoint(wp, vp);
  F.set((target.x - wp.x) * KP - vp.x * KD, (target.y - wp.y) * KP - vp.y * KD, (target.z - wp.z) * KP - vp.z * KD);
  const m = F.norm(); if (m > MAXA) F.scale(MAXA / m, F);
  F.scale(BAR.MASS, F);
  body.force.vadd(F, body.force);
  wp.vsub(body.position, r); r.cross(F, tq); body.torque.vadd(tq, body.torque);
}

// Invisible magnetic leash: a faint constant pull toward centre that ramps up smoothly as the bar nears the screen edge
const LEASH = { soft: 0.8, k: 170 };            // inside |ndc| < soft the bar is completely free; only the viewport edges push back
const lp = new THREE.Vector3();
function leash(dt) {
  if (held || resetting || !started) return;
  const p = body.position, v = body.velocity;
  lp.set(p.x, p.y, p.z).project(camera);
  const over = lp.z > 1 ? 1 : clamp((Math.max(Math.abs(lp.x), Math.abs(lp.y)) - LEASH.soft) / (1 - LEASH.soft), 0, 2);
  if (over <= 0) return;
  const len = Math.hypot(p.x, p.z) || 1, a = LEASH.k * over * over;
  v.x -= (p.x / len) * a * dt; v.z -= (p.z / len) * a * dt;
  v.y += (0.9 - p.y) * LEASH.k * over * over * 0.35 * dt;
  const vr = (v.x * p.x + v.z * p.z) / len;                       // outward speed → soak it up
  if (vr > 0) { const k = Math.min(1, 7 * over * dt) * vr; v.x -= (p.x / len) * k; v.z -= (p.z / len) * k; }

}
// Rubberband: past ±6 in X/Z or y > 8 a spring pushes the bar back toward the viewport
const RB = { lim: 11.5, ylim: 8, k: 90, damp: 5 };
function rubberband(dt) {
  if (held || resetting || !started) return;
  const p = body.position, v = body.velocity;
  const pull = (ax, over, dir) => { if (over > 0) { v[ax] -= dir * over * RB.k * dt; v[ax] *= Math.max(0, 1 - RB.damp * dt); body.wakeUp(); } };
  pull('x', Math.abs(p.x) - RB.lim, Math.sign(p.x));
  pull('z', Math.abs(p.z) - RB.lim, Math.sign(p.z));   // viewport edges are handled by leash(); this is only a backstop near the walls
  pull('y', p.y - RB.ylim, 1);
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), et = clock.elapsedTime;

  if (held) {                                    // cursor → world point on the camera-facing drag plane

    if (ray.ray.intersectPlane(dragPlane, tmp)) { target.copy(tmp); target.y = Math.max(target.y + lift.y, 0.08); }

    throwV.lerp(tmp.copy(target).sub(prevTarget).divideScalar(Math.max(dt, 1e-3)), k);
    prevTarget.copy(target);
  }

  slow.ts += (slow.target - slow.ts) * (1 - Math.exp(-dt * 6));

  key.position.set(fx - 3.4, 6.5, fz - 1.2); key.target.position.set(fx, 0, fz);
  jit.position.set(fx - 2.0, 7.0, fz - 3.0); jit.target.position.set(fx, 0, fz);
  spot.position.set(fx - 1.0, 8.5, fz - 2.5); spot.target.position.set(fx, 0, fz);

  // Camera: gentle parallax + intro dolly, always looking at the bar's home
  camState.ox += (camState.tx - camState.ox) * 0.05; camState.oy += (camState.ty - camState.oy) * 0.05;
  camState.zs += (camState.zt - camState.zs) * (1 - Math.exp(-dt * 8));     // scroll-zoom, eased

}

/* ───────────── 12. INTRO ───────────── */
const hintEl = document.getElementById('hint');
gsap.to(camState, { dolly: 0, duration: 2.8, ease: 'power3.out' });
gsap.to('#veil', { opacity: 0, duration: 1.6, ease: 'power2.out', onComplete: () => document.getElementById('veil').remove() });
gsap.delayedCall(0.6, () => { started = true; });
gsap.timeline({ delay: 1.2 })
  .to(hintEl, { opacity: 1, duration: 0.9, ease: 'power2.out' })
  .to(hintEl, { opacity: 0, duration: 1.0, ease: 'power2.in' }, '+=2.2');   // visible ~3s, then gone

})();
